      qos: {reliability: NOT_STATICALLY_DECLARED, durability: NOT_STATICALLY_DECLARED, history: NOT_STATICALLY_DECLARED, depth: NOT_STATICALLY_DECLARED}
      trigger: Gazebo world clock bridge
      created_when: always_in_sitl_runner
  subscribers:
    - node: world_observation_gate
      at: tools/runtime/world_observation_gate.py:54
      qos: {reliability: reliable, durability: volatile, history: keep_last, depth: 10}
      callback: _on_clock
      callback_group: default
      created_when: always
    - node: external_mode_scenario
      at: tools/runtime/external_mode_scenario.py:523
      qos: {reliability: best_effort, durability: volatile, history: keep_last, depth: 1}
      callback: _clock
      callback_group: default
      created_when: always
    - node: closed_loop_characterization
      at: tools/runtime/closed_loop_characterization.py:171
      qos: {reliability: best_effort, durability: volatile, history: keep_last, depth: 1}
      callback: _clock
      callback_group: default
      created_when: characterization_mode
  rate: NOT_MEASURED
  qos_compatible: true
  recorded_in_evidence_bag: true
  notes: "Runner expects 100 Hz in config/runtime/common.yaml, but this ICD records no runtime measurement."

