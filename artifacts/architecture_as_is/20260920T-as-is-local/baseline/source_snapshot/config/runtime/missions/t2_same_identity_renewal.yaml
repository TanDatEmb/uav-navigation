mission:
  version: 1
  id: t2_same_identity_renewal
  frame: lio_odom
  waypoints:
    # Start at the takeoff pose so External Mode can enter its normal mission
    # flow before the renewal target is published.
    - id: t2_takeoff_start
      position: [0.0, 0.0, 3.0]
      acceptance_radius_m: 0.7
      behavior: pass_through
    # This terminal target then keeps the mission/request identity fixed while
    # the runtime performs ordinary committed-future renewals.
    - id: t2_distant_stop
      position: [8.0, 0.0, 3.0]
      acceptance_radius_m: 0.8
      behavior: stop
      hold_s: 0.5
  planning:
    requested_cruise_speed_mps: 1.5
    unknown_policy: allow_unknown
  control:
    acceptance_speed_mps: 0.15
    acceptance_confirmation_s: 0.5
