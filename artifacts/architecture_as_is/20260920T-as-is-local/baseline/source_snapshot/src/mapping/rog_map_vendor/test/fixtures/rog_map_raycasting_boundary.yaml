# Regression fixture for sensor-origin ray evidence at the upper sliding-map edge.
rog_map:
  resolution: 0.2
  inflation_resolution: 0.2
  inflation_step: 4
  unk_inflation_en: false
  unk_inflation_step: 1
  intensity_thresh: -1
  point_filt_num: 1
  map_size: [10.0, 10.0, 6.0]
  fix_map_origin: [0.0, 0.0, 1.5]
  virtual_ground_ceiling_en: false
  virtual_ground_height: -1.1
  virtual_ceil_height: 5.8
  map_sliding:
    enable: true
    threshold: 1.5
  load_pcd_en: false
  frontier_extraction_en: false
  ros_callback:
    enable: false
    cloud_topic: "/unused"
    odom_topic: "/unused"
    odom_timeout: 0.05
  visualization:
    enable: false
    use_dynamic_reconfigure: false
    pub_unknown_map_en: false
    frame_id: "lio_odom"
    time_rate: 0.0
    frame_rate: 0
    range: [0.0, 0.0, 0.0]
  esdf:
    enable: false
    resolution: 0.2
    local_update_box: [10.0, 10.0, 6.0]
  raycasting:
    enable: true
    batch_update_size: 1
    unk_thresh: 1.0
    p_hit: 0.9
    p_miss: 0.49
    p_min: 0.12
    p_max: 0.98
    p_occ: 0.85
    p_free: 0.499
    # Sensor first-return/no-return minimum; never a vehicle-clearance radius.
    ray_range: [0.1, 100.0]
    local_update_box: [10.0, 10.0, 5.0]
