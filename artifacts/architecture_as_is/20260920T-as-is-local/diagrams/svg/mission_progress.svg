<text text-anchor="middle" x="215.5" y="-670" font-family="DejaVu Sans" font-size="10.00">T_ACTIVATE: PX4 external mode activation followed by the immediate mission</text>
<text text-anchor="middle" x="215.5" y="-659" font-family="DejaVu Sans" font-size="10.00">timer update</text>
<text text-anchor="middle" x="215.5" y="-648" font-family="DejaVu Sans" font-size="10.00">Guard: MissionController::update returns no goal while !airborne;</text>
<text text-anchor="middle" x="215.5" y="-637" font-family="DejaVu Sans" font-size="10.00">airborne is isArmed() &amp;&amp; local position z &gt; 0.5 m. If armed/above</text>
<text text-anchor="middle" x="215.5" y="-626" font-family="DejaVu Sans" font-size="10.00">threshold on immediate update, it enters ExecutingWaypoint and</text>
<text text-anchor="middle" x="215.5" y="-615" font-family="DejaVu Sans" font-size="10.00">emits PublishGoal. A separate source comment claims first goal is</text>
<text text-anchor="middle" x="215.5" y="-604" font-family="DejaVu Sans" font-size="10.00">published from onActivate; code plus unit test qualify that</text>
<text text-anchor="middle" x="215.5" y="-593" font-family="DejaVu Sans" font-size="10.00">statement.</text>
<text text-anchor="middle" x="215.5" y="-582" font-family="DejaVu Sans" font-size="10.00">Writes: F_MODE_COMMAND, F_WAYPOINT, F_FRAME_ALIGNMENT,</text>
<text text-anchor="middle" x="215.5" y="-571" font-family="DejaVu Sans" font-size="10.00">F_HANDOVER_MODE, F_HOLD_EXECUTOR</text>
<text text-anchor="middle" x="215.5" y="-560" font-family="DejaVu Sans" font-size="10.00">Effect: publish NavigationGoal; stationary setpoint while bounded initial</text>
<text text-anchor="middle" x="215.5" y="-549" font-family="DejaVu Sans" font-size="10.00">PVA acquisition; no evidence of PX4 applied command</text>
</a>
</g>
