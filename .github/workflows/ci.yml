name: uav-nav CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-contract:
    name: uav-nav / static-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check patch whitespace
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          else
            git diff --check "HEAD^..HEAD"
          fi
      - name: Install static-check dependency
        run: python -m pip install PyYAML
      - name: Run permanent authority and contract guards
        run: |
          set -euo pipefail
          for guard in \
            check_mission_authority_cut.py \
            check_execution_authority_cut.py \
            check_desired_intent_cut.py \
            check_failclosed_ownership_fencing.py \
            check_exact_optimization_injection.py \
            check_world_evidence_non_authority.py \
            check_navigation_command_contract.py \
            check_runtime_config_truth.py \
            check_state_transport_trace_scope.py; do
            python "tools/${guard}"
          done
          python tools/validate_runtime_safety_ledger.py

  python:
    name: uav-nav / python
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install evaluator test dependency
        run: python -m pip install PyYAML
      - name: Run runtime and evaluator tests
        run: python -m unittest discover -s tools/runtime/tests -p 'test_*.py'
