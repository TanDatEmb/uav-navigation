mission:
  version: 1
  id: recorded_replay_planning
  frame: lio_odom
  # The recorded replay helper publishes its own bounded synthetic goal. This
  # waypoint only makes the mission contract complete for the runtime loader.
  waypoints:
    - id: recorded_replay_reference
      position: [0.0, 0.0, 0.0]
      acceptance_radius_m: 0.5
      behavior: stop
  planning:
    max_velocity_mps: 12.0
    max_acceleration_mps2: 12.0
    max_jerk_mps3: 30.0
    # MAIN exploration is explicitly allowed to use UNKNOWN in this
    # planner-only benchmark. BACKUP certification remains KNOWN_FREE in the
    # planner verifier and is never relaxed by this mission policy.
    unknown_policy: allow_unknown
