mission:
  version: 1
  id: external_mode_pillar_route
  frame: lio_odom
  waypoints:
    - id: map_observation
      position: [-3.0, 4.5, 3.0]
      acceptance_radius_m: 0.6
      behavior: stop
      hold_s: 0.5
    - id: map_observation_near_pillar
      position: [-4.0, 4.0, 3.0]
      acceptance_radius_m: 0.6
      behavior: stop
      hold_s: 0.5
    - id: return_to_origin
      position: [0.0, 0.0, 3.0]
      acceptance_radius_m: 0.7
      behavior: pass_through
    - id: pillar_detour
      # Leave a measurable margin around the 0.55 m radius pillar while
      # retaining the west-side detour segment.
      position: [-6.0, 3.0, 3.0]
      acceptance_radius_m: 0.7
      behavior: pass_through
    - id: mission_finish
      position: [-6.0, 5.0, 3.0]
      acceptance_radius_m: 0.7
      behavior: stop
      hold_s: 0.5
  planning:
    replan_rate_hz: 5.0
    max_velocity_mps: 1.0
    max_acceleration_mps2: 2.0
    max_deceleration_mps2: 2.0
    max_jerk_mps3: 6.0
    unknown_policy: blocked
  control:
    output: auto
