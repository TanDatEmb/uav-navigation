fast_lio:
  ros__parameters:
    frames:
      {
        odom: lio_odom,
        base: base_link,
        imu: livox_imu_frame,
        lidar: livox_frame,
      }
    input:
      lidar_topic: /lidar/points
      imu_topic: /lidar/imu
      lidar_frame: livox_frame
      imu_frame: livox_imu_frame
      lidar_message_type: pointcloud2
      qos_reliability: reliable
      point_time:
        field: timestamp
        encoding: float64_absolute_nanoseconds
        scan_reference: minimum_point_time
        maximum_scan_duration_ns: 200000000
        maximum_header_offset_ns: 200000000
        maximum_boundary_overlap_ns: 1000000
        minimum_points_after_overlap_trim: 1000
    timing:
      lidar_mode: per_point
      clock_domain: sensor_time
      livox_timestamp_policy: timebase_authoritative
      max_imu_gap_ns: 20000000
      reject_timestamp_regression: true
    initial_prior:
      source: zero
      context: ground_startup
      source_frame: lio_odom
      source_frame_transform: same_frame
      components: { position: true, velocity: true, attitude: yaw_only }
      topic: /initial_state_prior
      topic_wait_timeout_ns: 2000000000
      maximum_topic_prior_age_ns: 500000000
      ground_fallback: zero
      maximum_full_attitude_tilt_disagreement_rad: 0.1745329252
      fixed:
        position_m: [0.0, 0.0, 0.0]
        orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
        linear_velocity_m_s: [0.0, 0.0, 0.0]
        angular_velocity_rad_s: [0.0, 0.0, 0.0]
    tracking:
      maximum_recoverable_imu_gap_ns: 50000000
      recovery_confirmation_updates: 3
      discontinuity_covariance_inflation: 10.0
    extrinsic:
      estimate_online: false
      translation_imu_lidar: [-0.019391, -0.000278, 0.080926]
      rotation_imu_lidar_xyzw: [0.0, 0.0, 0.0, 1.0]
    initialization: { minimum_imu_samples: 200, require_stationary: false }
    preprocessing:
      minimum_range_m: 0.1
      maximum_range_m: 40.0
      scan_voxel_size_m: 0.9
    registration:
      maximum_iterations: 4
      correspondence_parallel_threads: 3
    mapping:
      registration_map: { voxel_size_m: 0.3 }
      dynamic_filter: { enabled: false }
      local_map:
        half_extent_m: [50.0, 50.0, 25.0]
        crop_trigger_distance_m: 5.0
        absolute_map_point_guard: 250000
    output:
      publish_registered_points: false
    propagated_odometry:
      enabled: true
      publish_rate_hz: 50.0
      imu_ingress_capacity: 4096
      imu_history_duration_ns: 1000000000
      # Replay scan corrections can be separated by normal scheduling jitter.
      # Permit 750 ms of IMU propagation, leaving 250 ms before the retained
      # one-second history expires; a genuinely stale LIO correction still
      # stops publication fail-closed.
      maximum_correction_age_ns: 750000000
    runtime:
      imu_queue_capacity: 4096
      lidar_queue_capacity: 16
      maximum_processing_lag_ms: 500
      overload_policy: fail
