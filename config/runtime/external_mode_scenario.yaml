scenario:
  # The acceptance workflow exercises the complete product mission path. The
  # single_goal source remains available for adapter-only regression tests.
  execution: mission
  mission_file: config/runtime/missions/external_mode_pillar.yaml
  mission_waypoint_count: 5
  pillar_waypoint_index: 3
  wall_timeout_s: 360.0
  activation_timeout_s: 30.0
  takeoff_altitude_m: 3.0
  takeoff_timeout_s: 220.0
  takeoff_stable_s: 2.0
  takeoff_stable_speed_mps: 0.15
  takeoff_mode_settle_s: 1.0
  # GUI startup may briefly stall DDS. Require continuous fresh propagated
  # LIO odometry before the one real airborne External Mode activation.
  pre_activation_odometry_max_age_s: 0.10
  pre_activation_odometry_stable_s: 1.0
  mission_timeout_s: 120.0
  trajectory_publish_period_s: 0.50
  command_retry_period_s: 1.0
  arm_retry_period_s: 5.0
  # GUI runs can override this through MANUAL_TAKEOFF=1. In that mode the
  # harness observes the operator's Takeoff/arm and sends neither command.
  manual_takeoff: false
  planning_frame: lio_odom
  pillar_center_enu: [-4.5, 2.5, 3.0]
  pillar_radius_m: 0.55
  pillar_clearance_m: 0.8
  # Ground-truth acceptance margin after subtracting the vehicle collision
  # radius. A run with less clearance is unsafe even when it did not collide.
  minimum_collision_clearance_m: 0.10
