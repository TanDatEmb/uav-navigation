navigation_runtime:
  ros__parameters:
    mapping:
      enabled: true

      frames:
        odom: lio_odom
        lidar: livox_frame

      input:
        voxel_size_m: 0.20
        min_range_m: 0.50
        max_range_m: 0.0

      map:
        resolution_m: 0.2
        inflation_resolution_m: 0.2
        local_size_m: [30.0, 30.0, 12.0]

      raycast:
        min_range_m: 0.3
        max_range_m: 15.0

      input_qos:
        reliability: best_effort

      visualization:
        enabled: false
        publish_unknown: false
        publish_frontier: false
        publish_rate_hz: 10.0
        range_m: [25.0, 25.0, 12.0]
        max_points: 150000

    navigation:
      state:
        topic: /lio/odometry_propagated
        max_age_s: 0.5
      planner:
        max_velocity_mps: 2.0
        max_acceleration_mps2: 3.0
        trajectory_sample_dt_s: 0.05
        corridor_sample_spacing_m: 0.0
        maximum_time_scaling_iterations: 8
