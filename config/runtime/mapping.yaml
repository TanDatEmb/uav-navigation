# navigation_mapping_node runtime parameters.
#
# This is the navigation world-model configuration surface, distinct from
# fast_lio's own internal "mapping.*" parameters in dataset.yaml/sim.yaml
# (those configure FAST-LIO's RegistrationMap, not this world model — see
# docs/architecture/navigation_layers.md, ADR-008).
#
# Vendor policy is kept internal to navigation_mapping.
navigation_mapping_node:
  ros__parameters:
    mapping:
      enabled: true

      frames:
        odom: lio_odom
        lidar: livox_frame

      input:
        voxel_size_m: 0.20
        # Navigation-only sensor endpoint acceptance: suppress returns from
        # the vehicle/body shell before mapping voxelization and ROG raycast.
        # This is intentionally distinct from mapping.raycast.min_range_m,
        # which controls ROG ray traversal/bootstrap free-space semantics.
        min_range_m: 0.50
        max_range_m: 0.0

      map:
        resolution_m: 0.2
        inflation_resolution_m: 0.2
        local_size_m: [30.0, 30.0, 12.0]

      raycast:
        min_range_m: 0.3
        max_range_m: 15.0

      input_qos:
        reliability: best_effort

      visualization:
        enabled: false
        publish_unknown: false
        publish_frontier: false
        publish_rate_hz: 10.0
        range_m: [15.0, 15.0, 6.0]
        max_points: 150000
