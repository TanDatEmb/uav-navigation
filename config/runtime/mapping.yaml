navigation_runtime_node:
  ros__parameters:
    # Explicit off keeps the normal tracking and health responses active.
    # Zero coefficients alone never select a diagnostic bypass.
    tracking_experiment:
      mode: "off"
      tracking_gate_relaxed: false
      base_m: 0.0
      lateral_alpha_s: 0.0
      longitudinal_beta_s: 0.0
    navigation_runtime:
      registered_scan_topic: /lio/mapping_observation
      propagated_odometry_topic: /lio/odometry_propagated
      goal_topic: /navigation/goal
      status_topic: /navigation/mode_status
      command_topic: /navigation/navigation_command
      planning_frame: lio_odom
      body_frame_id: base_link
      # Required deployment provenance. Hardware remains fail-closed until an
      # immutable sensor-visibility certificate and verifier exist.
      deployment_profile: sitl
      data_freshness_window_s: 0.5
      planner_watchdog_timeout_s: 1.0
