navigation_runtime:
  ros__parameters:
    mapping:
      enabled: true

      frames:
        odom: lio_odom
        lidar: livox_frame

      input:
        voxel_size_m: 0.20
        min_range_m: 0.50
        max_range_m: 0.0

      map:
        resolution_m: 0.2
        inflation_resolution_m: 0.2
        local_size_m: [30.0, 30.0, 12.0]

      raycast:
        min_range_m: 0.3
        max_range_m: 15.0

      input_qos:
        reliability: best_effort

      visualization:
        enabled: false
        publish_unknown: false
        publish_frontier: false
        publish_rate_hz: 10.0
        range_m: [25.0, 25.0, 12.0]
        max_points: 150000

    navigation:
      state:
        topic: /lio/odometry_propagated
        # Keep planner freshness aligned with the External Mode finite gate;
        # measured SITL propagated-odometry gaps can approach 0.82 s under
        # mapping load. Safety fallback still fails closed beyond this bound.
        max_age_s: 1.0
      replan_rate_hz: 5.0
      replan_tracking_error_m: 0.5
      planner:
        max_velocity_mps: 2.0
        max_acceleration_mps2: 3.0
        max_deceleration_mps2: 3.0
        max_jerk_mps3: 6.0
        trajectory_sample_dt_s: 0.05
        trajectory_generator: bspline
        bspline:
          smoothing_iterations: 12
          smoothing_step: 0.04
          snap_weight: 1.0
          path_length_weight: 0.10
          reference_weight: 0.35
          # Faster initial timing for rolling replans. Hard limits are still
          # enforced by the planner/verifier and may stretch this candidate.
          time_scale: 1.10
          time_margin_s: 0.25
          optimization_sample_dt_s: 0.04
        corridor_sample_spacing_m: 0.0
        maximum_time_scaling_iterations: 5
        allow_unknown_start: false
        # Virtual KnownFree sphere around the trusted current vehicle pose.
        # The simulation runner sets this to vehicle radius + safety margin;
        # the real/default profile leaves it disabled at zero.
        unknown_start_radius_m: 0.0
        # Optimistic nominal planning is simulation-only and must be enabled
        # by an explicit runner flag. Real/default profiles stay fail-closed.
        allow_nominal_unknown: true
        nominal_commitment_horizon_s: 1.5
        # Atomic hand-over lead time. PX4 keeps the previous trajectory active
        # until this future timestamp, so replanning does not restart at t=0.
        switch_delay_s: 0.12
      safety:
        # Online stopping-distance governor. The cap is reduced before the
        # visible free corridor becomes too short for a fail-safe stop.
        latency_s: 0.08
        stop_margin_m: 0.25
        visibility_horizon_m: 15.0
      # Rolling trajectory lookahead. The planner chooses a forward horizon
      # from speed/stopping distance and clips it to the current map boundary;
      # it is not a local waypoint completion threshold.
      planning_horizon:
        minimum_distance_m: 10.0
        maximum_distance_m: 30.0
        preview_time_s: 5.0
        boundary_margin_m: 2.0
      # Compatibility parameters for the bounded A* horizon selector. The
      # selector no longer emits a completion event; the B-spline suffix is
      # continuously replanned and only mission acceptance completes a goal.
      local_subgoal:
        enabled: true
        boundary_margin_m: 1.0
        # Match the configured LiDAR/raycast visibility.  This is a search
        # bound only; a mission waypoint inside the observed window is still
        # selected directly, and the selector is rerun every planning tick.
        max_distance_m: 15.0
        # Kept as a compatibility parameter; local endpoints are no longer
        # completion-gated or hysteresis-latched by the runtime.
        switch_distance_m: 0.8
        # Minimum tangent speed fraction for intermediate local goals. A
        # non-zero value keeps receding-horizon replanning continuous; set to
        # zero only when an application explicitly wants stop-and-replan.
        continuation_speed_fraction: 0.35
