runtime:
  monitor_queue_depth: 100
  thresholds:
    minimum_rate_fraction: 0.90
    maximum_synchronization_tolerance_ms: 20.0
    stale_after_s: 1.0
    replay_tail_grace_s: 0.5
  streams:
    imu: {expected_hz: 200.0, stale_after_s: 0.10}
    lidar: {expected_hz: 10.0, stale_after_s: 0.50}
    corrected_odometry: {expected_hz: 10.0, stale_after_s: 1.00}
    propagated_odometry: {expected_hz: 50.0, stale_after_s: 0.50}
    mapping_diagnostics: {expected_hz: 2.0, stale_after_s: 2.0}
    external_odometry: {expected_hz: 50.0, stale_after_s: 0.20}
    ground_truth_odometry: {expected_hz: 50.0, stale_after_s: 0.50}
    px4_odometry: {expected_hz: 30.0, stale_after_s: 1.00}
    vehicle_status: {expected_hz: 10.0, stale_after_s: 1.00}
    local_position: {expected_hz: 30.0, stale_after_s: 1.00}
    estimator_status_flags: {expected_hz: 1.0, stale_after_s: 2.50}
  timeouts:
    startup_s: 90
    lio_tracking_s: 90
    external_odometry_s: 45
    replay_s: 900
    drain_s: 120
    post_flight_monitor_s: 5
