px4_navigation_external_mode:
  ros__parameters:
    navigation:
      # SUPER publishes one polynomial trajectory. PX4 evaluates this native
      # contract directly at the 50 Hz setpoint rate.
      super_trajectory_topic: /navigation/super_trajectory
      planner_heartbeat_topic: /navigation/planner_heartbeat
      state_topic: /lio/odometry_propagated
      planning_frame: lio_odom
      # The benchmark uses the bounded velocity tracker as the final PX4
      # handover guard.  Direct P/V/A output allowed a stale position or
      # acceleration setpoint to produce measured-speed runaway far above the
      # planner cap; velocity-only output keeps the commanded norm inside the
      # speed sweep authority while preserving planner PVA for diagnostics.
      prefer_velocity_output: true
      mission_complete_topic: /navigation/mission_complete
      trajectory_stale_after_s: 0.75
      # The SITL LIO/external-odometry stream has measured nominal gaps up to
      # 0.82 s under mapping load; keep a finite fail-closed margin above that.
      state_stale_after_s: 1.0
      trajectory_wait_timeout_s: 2.0
      # Allow a bounded scan re-anchor burst; sustained invalid observability
      # still fails closed (negative localization profiles).
      lio_health_grace_s: 1.0
      velocity_tracker:
        position_gain: 1.0
        max_velocity_mps: 5.0
        max_acceleration_mps2: 5.0
        max_deceleration_mps2: 5.0
        max_position_error_m: 2.0
        max_jerk_mps3: 12.0
        trajectory_preview_s: 0.15
