px4_navigation_external_mode:
  ros__parameters:
    navigation:
      # Atomic nominal/safety contract. The legacy trajectory topic remains
      # available only when explicitly configured for migration tests.
      trajectory_bundle_topic: /navigation/trajectory_bundle
      trajectory_topic: ""
      state_topic: /lio/odometry_propagated
      planning_frame: lio_odom
      prefer_velocity_output: true
      mission_complete_topic: /navigation/mission_complete
      trajectory_stale_after_s: 0.75
      # The SITL LIO/external-odometry stream has measured nominal gaps up to
      # 0.82 s under mapping load; keep a finite fail-closed margin above that.
      state_stale_after_s: 1.0
      trajectory_wait_timeout_s: 2.0
      # Allow a bounded scan re-anchor burst; sustained invalid observability
      # still fails closed (negative localization profiles).
      lio_health_grace_s: 1.0
      velocity_tracker:
        position_gain: 1.0
        max_velocity_mps: 3.0
        max_acceleration_mps2: 3.0
        max_deceleration_mps2: 3.0
        max_position_error_m: 2.0
        max_jerk_mps3: 6.0
        trajectory_preview_s: 0.15
