# Benchmark registry.  The runner resolves this descriptor into every
# session artifact so geometry, mission, truth and expected outcome cannot
# silently diverge.  SDF remains hand-authored for smoke; stress worlds are
# deterministic assets referenced here and may be regenerated later.
profiles:
  occlusion_featured:
    family: occlusion
    world: occlusion
    mission: occlusion
    expected_outcome: mission_complete
    stochastic: false
    seed: 0
    collision_truth: [occluder, hidden_obstacle, side_wall, feature_mid_east, feature_low_west, feature_route_north, feature_route_south, feature_route_west, feature_tall_south, feature_corner_east, feature_pole_north]
