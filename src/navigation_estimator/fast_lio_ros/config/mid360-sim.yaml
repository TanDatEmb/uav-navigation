fast_lio:
  ros__parameters:
    frames: {odom: odom, base: base_link, imu: imu_link, lidar: lidar_link}
    input:
      lidar_topic: /lidar/points
      imu_topic: /lidar/imu
      lidar_frame: lidar_link
      imu_frame: imu_link
      lidar_message_type: pointcloud2
      qos_reliability: best_effort
    timing:
      lidar_mode: simultaneous_scan
      clock_domain: simulation_time
      livox_timestamp_policy: require_header_match
      max_imu_gap_ns: 20000000
      reject_timestamp_regression: true
    tracking:
      maximum_recoverable_imu_gap_ns: 50000000
      recovery_confirmation_updates: 3
      discontinuity_covariance_inflation: 10.0
    extrinsic:
      # Existing kinematic harness: lidar_link is 0.15 m above imu_link.
      estimate_online: false
      translation_imu_lidar: [0.0, 0.0, 0.15]
      rotation_imu_lidar_xyzw: [0.0, 0.0, 0.0, 1.0]
    initialization: {minimum_imu_samples: 200, require_stationary: true}
    preprocessing:
      minimum_range_m: 0.1
      maximum_range_m: 40.0
      scan_voxel_size_m: 0.2
    registration: {maximum_iterations: 4}
    mapping:
      registration_map: {voxel_size_m: 0.2}
    output:
      publish_registered_points: true
      publish_local_map: true
