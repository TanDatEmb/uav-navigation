# Gazebo Harmonic -> ROS 2 Jazzy bridge for PX4 x500 MID-360 smoke test.
- ros_topic_name: /clock
  gz_topic_name: /world/px4_lio_smoke/clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

- ros_topic_name: /lidar/points
  gz_topic_name: /sim/mid360/scan/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS

- ros_topic_name: /lidar/imu
  gz_topic_name: /sim/mid360/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS

# Evaluation-only Gazebo OdometryPublisher ground truth in ENU/FLU (odom/world
# frame and base_link child frame).  This ROS topic is consumed only by the
# runtime monitor/report.  It must never be remapped to LIO or to
# /fmu/in/vehicle_visual_odometry; run_px4_mid360.sh disables PX4's direct GZ
# odometry subscriber with PX4_PARAM_SIM_GZ_EN_ODOM=0.
- ros_topic_name: /sim/ground_truth/odometry
  gz_topic_name: /model/x500_mid360/odometry_with_covariance
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.OdometryWithCovariance
  direction: GZ_TO_ROS
